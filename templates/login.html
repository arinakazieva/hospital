<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container header-container">
            <div class="logo"><a href="{{ url_for('home') }}" style="text-decoration:none; color:inherit;"><h1>🏥 Медицинский Центр</h1></a></div>
            <nav><ul><li><a href="{{ url_for('home') }}">Главная</a></li></ul></nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>Вход в систему</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="post">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Войти</button>
            </form>
            <p style="margin-top: 15px; text-align: center;">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
        </div>
    </div>
</body>
</html>
